name: Tests and stored-model verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install recorded NumPy runtime
        run: python -m pip install -r requirements-recorded.txt
      - name: Run 25 unit tests
        run: python -m unittest -v test_tinyquant
      - name: Verify 21 stored models without retraining
        run: python verify_results.py results
